<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wander Generator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #FAF9F4;
    --panel: #FFFFFF;
    --panel-raised: #FCFBF7;
    --cream: #171B18;
    --cream-dim: #767D72;
    --gold: #1E7A5F;
    --gold-soft: #279173;
    --rust: #FF6B4A;
    --teal: #4F8B82;
    --line: rgba(23,27,24,0.08);
    --line-strong: rgba(23,27,24,0.15);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }
  /* ---------- LEFT PANEL ---------- */
  .panel{
    width:420px;
    min-width:420px;
    height:100%;
    background:var(--panel);
    box-shadow:1px 0 0 var(--line), 4px 0 24px rgba(23,27,24,0.04);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    z-index:10;
  }
  .panel-scroll{
    overflow-y:auto;
    flex:1;
    padding:28px 26px 40px;
  }
  .panel-scroll::-webkit-scrollbar{width:8px;}
  .panel-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .brand svg{ flex-shrink:0; }
  .brand h1{
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:25px;
    letter-spacing:-0.2px;
    margin:0;
  }
  .tagline{
    font-family:'Inter',sans-serif;
    font-style:italic;
    font-weight:400;
    color:var(--cream-dim);
    font-size:14.5px;
    margin:0 0 28px;
  }

  label.field-label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:8px;
    margin-top:22px;
  }
  .field-label:first-of-type{margin-top:0;}

  input[type="text"]{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line-strong);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:11px 13px;
    border-radius:10px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(30,122,95,0.15); }
  input[type="text"]::placeholder{ color:var(--cream-dim); opacity:0.7;}

  .city-row{ display:flex; gap:8px; }
  .city-opt{
    flex:1;
    padding:9px 6px;
    text-align:center;
    border:1px solid var(--line-strong);
    border-radius:999px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--cream-dim);
    transition:all .15s ease;
    user-select:none;
  }
  .city-opt:hover{ border-color:var(--gold-soft); color:var(--cream); }
  .city-opt.active{ border-color:var(--gold); background:var(--gold); color:#fff; }

  .distance-row{ display:flex; gap:8px; }
  .distance-opt{
    flex:1;
    padding:10px 6px;
    text-align:center;
    border:1px solid var(--line-strong);
    border-radius:10px;
    cursor:pointer;
    font-size:12.5px;
    line-height:1.3;
    color:var(--cream-dim);
    transition:all .15s ease;
    user-select:none;
  }
  .distance-opt strong{ display:block; font-family:'Sora',sans-serif; font-size:16px; color:var(--cream); font-weight:500;}
  .distance-opt:hover{ border-color:var(--gold-soft); }
  .distance-opt.active{ border-color:var(--gold); background:rgba(30,122,95,0.08); color:var(--cream);}

  .theme-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .theme-opt{
    border:1px solid var(--line-strong);
    border-radius:10px;
    padding:12px 10px;
    cursor:pointer;
    transition:all .15s ease;
    user-select:none;
  }
  .theme-opt .t-name{
    font-family:'Sora',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--cream);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .theme-opt .t-desc{
    font-size:11.5px;
    color:var(--cream-dim);
    margin-top:3px;
    line-height:1.35;
  }
  .theme-opt:hover{ border-color:var(--gold-soft); }
  .theme-opt.active{ border-color:var(--gold); background:rgba(30,122,95,0.08); }
  .theme-opt.surprise{ grid-column:1 / -1; }

  .generate-btn{
    width:100%;
    margin-top:26px;
    padding:14px;
    background:var(--gold);
    color:#fff;
    border:none;
    border-radius:10px;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    letter-spacing:0.1px;
    box-shadow:0 4px 14px rgba(30,122,95,0.28);
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .generate-btn:hover{ background:var(--gold-soft); box-shadow:0 6px 18px rgba(30,122,95,0.32); }
  .generate-btn:active{ transform:scale(0.99); }
  .generate-btn:disabled{ opacity:0.55; cursor:wait; }

  .status-note{
    font-size:12px;
    color:var(--cream-dim);
    margin-top:10px;
    min-height:16px;
    font-family:'IBM Plex Mono',monospace;
  }
  .status-note.warn{ color:var(--rust); }

  /* ---------- WALK CARDS ---------- */
  .walks{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .section-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.4px;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-eyebrow::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .walk-card{
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-left:3px solid transparent;
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(23,27,24,0.04);
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .walk-card:hover{ border-color:var(--line-strong); box-shadow:0 6px 18px rgba(23,27,24,0.08); transform:translateY(-1px); }
  .walk-card.selected{
    border-left-color:var(--gold);
    background:rgba(30,122,95,0.06);
    border-color:var(--line-strong);
    box-shadow:0 6px 18px rgba(23,27,24,0.08);
  }
  .walk-card .wc-title{
    font-family:'Sora',sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .walk-card .wc-narrative{
    font-size:13px;
    line-height:1.5;
    color:var(--cream-dim);
    margin:0 0 12px;
  }
  .wc-meta{
    display:flex;
    gap:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--gold-soft);
    margin-bottom:10px;
  }
  .wc-scores{
    display:flex;
    gap:16px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .wc-score{ text-align:left; }
  .wc-score .num{
    font-family:'Sora',sans-serif;
    font-size:17px;
    color:var(--cream);
    font-weight:500;
  }
  .wc-score .lbl{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--cream-dim);
  }

  /* ---------- DETAIL DRAWER ---------- */
  .detail{
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid var(--line-strong);
    display:none;
  }
  .detail.open{ display:block; }
  .detail h2{
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 6px;
  }
  .detail .d-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold-soft);
    margin-bottom:10px;
  }
  .detail .d-narrative{
    font-family:'Inter',sans-serif;
    font-style:italic;
    font-size:14.5px;
    line-height:1.55;
    color:var(--cream-dim);
    margin-bottom:20px;
  }
  .stop-list{ display:flex; flex-direction:column; }
  .stop-item{
    display:flex;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .stop-item:last-child{ border-bottom:none; }
  .stop-item:hover .stop-num{ background:var(--gold); color:var(--ink); }
  .stop-num{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--gold);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    transition:all .15s ease;
  }
  .stop-body .stop-name{
    font-family:'Sora',sans-serif;
    font-size:15.5px;
    font-weight:500;
    margin-bottom:2px;
  }
  .stop-body .stop-desc{
    font-size:12.5px;
    color:var(--cream-dim);
    line-height:1.4;
  }

  /* ---------- MAP ---------- */
  .map-wrap{ flex:1; position:relative; height:100%; }
  #map{ height:100%; width:100%; background:#EFEDE6; }

  .leaflet-container{ font-family:'Inter',sans-serif; }
  .stop-marker{
    background:var(--panel);
    border:2px solid var(--gold);
    color:var(--cream);
    border-radius:50%;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:500;
    box-shadow:0 2px 8px rgba(23,27,24,0.18);
  }
  .start-marker{
    background:var(--rust);
    border:2px solid #FFFFFF;
    color:var(--cream);
    border-radius:50%;
    width:16px;
    height:16px;
    box-shadow:0 0 0 6px rgba(255,107,74,0.18), 0 2px 6px rgba(23,27,24,0.2);
  }
  .leaflet-popup-content-wrapper{
    background:var(--panel-raised);
    color:var(--cream);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(23,27,24,0.14);
  }
  .leaflet-popup-content{ font-family:'Inter',sans-serif; font-size:13px; margin:10px 12px;}
  .leaflet-popup-content b{ font-family:'Sora',sans-serif; font-size:14.5px; }
  .leaflet-popup-tip{ background:var(--panel-raised); }

  .empty-state{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    pointer-events:none;
    text-align:center;
    padding:40px;
  }
  .empty-state svg{ opacity:0.5; margin-bottom:6px; }
  .empty-state h3{
    font-family:'Sora',sans-serif;
    font-weight:500;
    font-size:20px;
    color:var(--cream-dim);
    margin:0;
  }
  .empty-state p{
    font-size:13px;
    color:var(--cream-dim);
    opacity:0.7;
    max-width:280px;
    margin:0;
  }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .panel{ width:100%; min-width:0; height:56%; order:2; border-right:none; border-top:1px solid var(--line);}
    .map-wrap{ height:44%; order:1; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="panel">
    <div class="panel-scroll" id="panelScroll">

      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18.5" stroke="#1E7A5F" stroke-width="1"/>
          <path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#1E7A5F"/>
          <path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#171B18" opacity="0.5"/>
          <circle cx="20" cy="20" r="2" fill="#171B18"/>
        </svg>
        <h1>Wander Generator</h1>
      </div>
      <p class="tagline">Find a better way to wander.</p>

      <label class="field-label">Starting point</label>
      <input type="text" id="startInput" list="startOptions" placeholder="e.g. Alfama, Lisbon" value="Rossio, Lisbon" />
      <datalist id="startOptions"></datalist>

      <label class="field-label">Walking distance</label>
      <div class="distance-row" id="distanceRow"></div>

      <label class="field-label">Theme</label>
      <div class="theme-grid" id="themeGrid"></div>

      <button class="generate-btn" id="generateBtn">Generate walks</button>
      <div class="status-note" id="statusNote"></div>

      <div class="walks" id="walksContainer"></div>

      <div class="detail" id="detailPanel"></div>

    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="empty-state" id="emptyState">
      <svg width="46" height="46" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18.5" stroke="#8A9186" stroke-width="1"/>
        <path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#8A9186"/>
        <path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#8A9186" opacity="0.4"/>
      </svg>
      <h3>Your walk will appear here</h3>
      <p>Pick a starting point, distance and theme, then generate a few reasons to go outside.</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* --------------------------- UTILITIES ------------------------------------ */
function haversineKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLon = (b.lon - a.lon) * Math.PI/180;
  const lat1 = a.lat * Math.PI/180, lat2 = b.lat * Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// mulberry32 seeded PRNG, deterministic given a string seed
function makeRng(seedStr){
  let h = 1779033703 ^ seedStr.length;
  for (let i=0; i<seedStr.length; i++){
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function geocode(text){
  const key = (text || "").trim().toLowerCase();
  if (START_POINTS[key]) return START_POINTS[key];
  // fuzzy: match on first token against known neighbourhood keys
  for (const k of Object.keys(START_POINTS)){
    if (key.includes(k)) return START_POINTS[k];
  }
  return START_POINTS["rossio"];
}

function themeWeights(theme, rng){
  if (theme !== "surprise") return THEMES[theme].weights;
  // surprise: pick two random fields with random weights, stable for this rng stream
  const fields = ["interest","quirky","history","food","nature","architecture"];
  const w = {interest:0.2, quirky:0, history:0, food:0, nature:0, architecture:0};
  const shuffled = fields.slice().sort(() => rng() - 0.5);
  w[shuffled[0]] = 0.9 + rng()*0.5;
  w[shuffled[1]] = 0.6 + rng()*0.4;
  return w;
}

function themeScore(poi, weights){
  let s = 0;
  for (const f in weights) s += (poi[f]||0) * weights[f];
  s -= poi.touristiness * 0.5;
  return s;
}

/* ------------------------- ROUTE GENERATION -------------------------------- */
function buildCandidateRoute(start, targetKm, maxStops, weights, rng){
  const searchRadius = targetKm * 0.55; // loose loop radius heuristic
  let pool = POIS.filter(p => haversineKm(start, p) <= searchRadius);
  const stops = [];
  const usedIds = new Set();
  let current = start;
  let lastCat = null;
  let distSoFar = 0;

  while (stops.length < maxStops[1]){
    const candidates = pool.filter(p => !usedIds.has(p.id));
    if (candidates.length === 0) break;

    let scored = candidates.map(p => {
      const dNext = haversineKm(current, p);
      const dReturn = haversineKm(p, start);
      const catPenalty = (p.cat === lastCat) ? 2.5 : 0;
      const distPenalty = dNext * 1.4;
      const overBudgetPenalty = Math.max(0, (distSoFar + dNext + dReturn) - targetKm*1.35) * 2;
      const score = themeScore(p, weights) - distPenalty - catPenalty - overBudgetPenalty + rng()*1.2;
      return {poi:p, score, dNext, dReturn};
    });
    scored.sort((a,b) => b.score - a.score);

    // stop condition: if we already have minimum stops and the loop is nearly at budget, consider stopping
    if (stops.length >= maxStops[0]){
      const bestReturn = haversineKm(current, start);
      if (distSoFar + bestReturn >= targetKm * 0.95) break;
    }

    // pick with slight randomness among top few to diversify candidate sets
    const topN = scored.slice(0, Math.min(4, scored.length));
    const pick = topN[Math.floor(rng() * topN.length)];
    if (!pick || pick.score < -6) break;

    stops.push(pick.poi);
    usedIds.add(pick.poi.id);
    distSoFar += pick.dNext;
    current = pick.poi;
    lastCat = pick.poi.cat;

    if (distSoFar >= targetKm * 1.15) break;
  }
  return stops;
}

// simple 2-opt improvement over the closed loop start -> stops... -> start
function twoOptImprove(start, stops){
  if (stops.length < 3) return stops;
  const seq = stops.slice();
  const loopDist = (arr) => {
    let d = haversineKm(start, arr[0]);
    for (let i=0; i<arr.length-1; i++) d += haversineKm(arr[i], arr[i+1]);
    d += haversineKm(arr[arr.length-1], start);
    return d;
  };
  let improved = true;
  let guard = 0;
  while (improved && guard < 20){
    improved = false; guard++;
    for (let i=0; i<seq.length-1; i++){
      for (let j=i+1; j<seq.length; j++){
        const trial = seq.slice(0,i).concat(seq.slice(i,j+1).reverse(), seq.slice(j+1));
        if (loopDist(trial) < loopDist(seq) - 0.01){
          seq.splice(0, seq.length, ...trial);
          improved = true;
        }
      }
    }
  }
  return seq;
}

function scoreRoute(start, stops, targetKm, weights){
  let base = 0;
  const cats = new Set();
  stops.forEach(p => { base += themeScore(p, weights); cats.add(p.cat); });
  const varietyBonus = cats.size * 1.8;
  let dist = haversineKm(start, stops[0]);
  for (let i=0; i<stops.length-1; i++) dist += haversineKm(stops[i], stops[i+1]);
  dist += haversineKm(stops[stops.length-1], start);
  const distPenalty = Math.abs(dist - targetKm) * 1.5;
  return { total: base + varietyBonus - distPenalty, loopKm: dist };
}

function routeOverlap(a, b){
  const idsA = new Set(a.map(p=>p.id));
  const shared = b.filter(p=>idsA.has(p.id)).length;
  return shared / Math.min(a.length, b.length);
}

function generateWalkCandidates(startText, distanceKey, themeKey){
  const start = geocode(startText);
  const { target, stops } = DISTANCES[distanceKey];
  const seedBase = `${startText}|${distanceKey}|${themeKey}`;
  const surpriseRng = makeRng(seedBase + "|weights");
  const weights = themeWeights(themeKey, surpriseRng);

  const attempts = [];
  for (let v = 0; v < 7; v++){
    const rng = makeRng(seedBase + "|" + v);
    let route = buildCandidateRoute(start, target, stops, weights, rng);
    if (route.length < 3) continue;
    route = twoOptImprove(start, route);
    const { total, loopKm } = scoreRoute(start, route, target, weights);
    attempts.push({ stops: route, score: total, loopKm });
  }
  attempts.sort((a,b) => b.score - a.score);

  const finalRoutes = [];
  for (const a of attempts){
    if (finalRoutes.length >= 3) break;
    const tooSimilar = finalRoutes.some(f => routeOverlap(f.stops, a.stops) > 0.55);
    if (!tooSimilar) finalRoutes.push(a);
  }
  // pad if we didn't find 3 sufficiently distinct routes
  for (const a of attempts){
    if (finalRoutes.length >= 3) break;
    if (!finalRoutes.includes(a)) finalRoutes.push(a);
  }

  return { start, weights, routes: finalRoutes.slice(0,3) };
}

const TITLE_ADJ = {
  curious: ["The Forgotten", "The Quiet", "The Unlikely", "The Overlooked"],
  food: ["The Well-Fed", "The Second Breakfast", "The Crumbs and", "The Market"],
  nature: ["The Green", "The Breathing", "The Shaded", "The Uphill"],
  weird: ["The Strange", "The Odd Hour", "The Sideways", "The Peculiar"],
  architecture: ["The Built", "The Standing", "The Rebuilt", "The Skyline"],
  surprise: ["The Unlabelled", "The Unmarked", "The Whatever-This-Is", "The Blind"],
};
const TITLE_NOUN = ["Corners","Route","Wander","Circuit","Detour","Loop","Hours"];

function templateNarrative(theme, stops){
  const rng = makeRng(stops.map(s=>s.id).join(",") + theme);
  const adjList = TITLE_ADJ[theme] || TITLE_ADJ.curious;
  const title = `${adjList[Math.floor(rng()*adjList.length)]} ${TITLE_NOUN[Math.floor(rng()*TITLE_NOUN.length)]}`;
  const first = stops[0].name, last = stops[stops.length-1].name;
  const mid = stops.length > 2 ? stops[Math.floor(stops.length/2)].name : stops[0].name;
  const themeFlavor = {
    curious: "for people who'd rather investigate a city than photograph it",
    food: "built around the things worth being a little bit hungry for",
    nature: "that trades pavement for green wherever it can",
    weird: "for the things most itineraries quietly leave out",
    architecture: "that reads the city through what it built and rebuilt",
    surprise: "assembled on criteria we're not going to tell you",
  }[theme] || "";
  const narrative = `Starting near ${first}, this walk drifts past ${mid} on its way to ${last} — a route ${themeFlavor}.`;
  return { title, narrative };
}

async function aiNarrative(theme, stops, distanceLabel){
  const stopList = stops.map((s,i) => `${i+1}. ${s.name} — ${s.desc}`).join("\n");
  const prompt = `You are writing copy for a walking-tour app called "Wander Generator". Given a themed sequence of real stops in Lisbon, write a short, evocative walk title and a 2-sentence narrative explaining why this specific walk is worth taking. Tone: editorial travel writing, sophisticated, a little playful, never generic or salesy. No exclamation marks. Respond with ONLY raw JSON, no markdown fences, no preamble, in exactly this shape: {"title": "...", "narrative": "..."}

Theme: ${theme}
Approximate length: ${distanceLabel}
Stops in order:
${stopList}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!response.ok) throw new Error("AI narrative request failed");
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === "text");
  if (!textBlock) throw new Error("No text in AI response");
  const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  if (!parsed.title || !parsed.narrative) throw new Error("Malformed AI narrative");
  return parsed;
}

/* ------------------------------- SCORES ------------------------------------ */
function walkScores(stops){
  const n = stops.length;
  const avg = (f) => stops.reduce((s,p)=>s+p[f],0) / n;
  const interesting = Math.min(10, avg("interest") * 2);
  const local = Math.min(10, (5 - avg("touristiness")) * 2);
  const quirky = Math.min(10, avg("quirky") * 2);
  return {
    interesting: Math.max(0, interesting).toFixed(1),
    local: Math.max(0, local).toFixed(1),
    quirky: Math.max(0, quirky).toFixed(1),
  };
}

/* --------------------------------- OSRM ------------------------------------- */
async function fetchWalkingRoute(start, stops){
  const coords = [start, ...stops, start].map(p => `${p.lon},${p.lat}`).join(";");
  const url = `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("OSRM request failed");
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error("No OSRM route returned");
  const r = data.routes[0];
  return {
    coordsLatLng: r.geometry.coordinates.map(c => [c[1], c[0]]),
    distanceKm: r.distance / 1000,
    durationMin: r.duration / 60,
    approximate: false,
  };
}

function fallbackRoute(start, stops){
  const pts = [start, ...stops, start];
  let dist = 0;
  for (let i=0; i<pts.length-1; i++) dist += haversineKm(pts[i], pts[i+1]);
  const distanceKm = dist * 1.2; // pedestrian inefficiency factor vs straight-line
  return {
    coordsLatLng: pts.map(p => [p.lat, p.lon]),
    distanceKm,
    durationMin: (distanceKm / 4.6) * 60,
    approximate: true,
  };
}

/* --------------------------------- MAP -------------------------------------- */
function initMap(){
  map = L.map("map", { zoomControl:true, attributionControl:true }).setView([38.7139, -9.1394], 14);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: "abcd",
    maxZoom: 19,
  }).addTo(map);
  routeLayer = L.layerGroup().addTo(map);
}

function clearMapLayers(){
  routeLayer.clearLayers();
  stopMarkers = [];
  if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
}

function renderWalkOnMap(walk){
  clearMapLayers();
  document.getElementById("emptyState").style.display = "none";

  startMarker = L.marker([walk.start.lat, walk.start.lon], {
    icon: L.divIcon({ className:"", html:'<div class="start-marker"></div>', iconSize:[16,16] })
  }).bindPopup(`<b>Start</b>`).addTo(map);

  if (walk.geo && walk.geo.coordsLatLng && walk.geo.coordsLatLng.length > 1){
    const poly = L.polyline(walk.geo.coordsLatLng, {
      color: walk.geo.approximate ? "#FF6B4A" : "#1E7A5F",
      weight: 4,
      opacity: 0.85,
      dashArray: walk.geo.approximate ? "6,6" : null,
    }).addTo(routeLayer);
    map.fitBounds(poly.getBounds(), { padding:[60,60] });
  }

  walk.stops.forEach((poi, i) => {
    const m = L.marker([poi.lat, poi.lon], {
      icon: L.divIcon({ className:"", html:`<div class="stop-marker">${i+1}</div>`, iconSize:[26,26] })
    }).bindPopup(`<b>${i+1}. ${poi.name}</b><br>${poi.desc}`).addTo(routeLayer);
    stopMarkers.push(m);
  });
}

function flyToStop(idx){
  const m = stopMarkers[idx];
  if (!m) return;
  map.flyTo(m.getLatLng(), 17, { duration:0.6 });
  m.openPopup();
}

/* --------------------------------- UI ---------------------------------------- */
function buildStaticUI(){
  // distance options
  const distRow = document.getElementById("distanceRow");
  Object.entries(DISTANCES).forEach(([key, d]) => {
    const el = document.createElement("div");
    el.className = "distance-opt" + (key === state.distance ? " active" : "");
    el.dataset.key = key;
    el.innerHTML = `<strong>${d.label}</strong>${d.sub}`;
    el.onclick = () => {
      state.distance = key;
      document.querySelectorAll(".distance-opt").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
    };
    distRow.appendChild(el);
  });

  // theme options
  const grid = document.getElementById("themeGrid");
  Object.entries(THEMES).forEach(([key, t]) => {
    const el = document.createElement("div");
    el.className = "theme-opt" + (key === "surprise" ? " surprise" : "") + (key === state.theme ? " active" : "");
    el.dataset.key = key;
    el.innerHTML = `<div class="t-name"><span>${t.icon}</span> ${t.label}</div><div class="t-desc">${t.desc}</div>`;
    el.onclick = () => {
      state.theme = key;
      document.querySelectorAll(".theme-opt").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
    };
    grid.appendChild(el);
  });

  // starting-point suggestions
  const dl = document.getElementById("startOptions");
  ["Rossio, Lisbon","Alfama, Lisbon","Chiado, Lisbon","Graça, Lisbon","Mouraria, Lisbon",
   "Príncipe Real, Lisbon","Estrela, Lisbon","Cais do Sodré, Lisbon","LX Factory, Lisbon"]
    .forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      dl.appendChild(opt);
    });

  document.getElementById("generateBtn").onclick = handleGenerate;
}

function setStatus(msg, warn){
  const el = document.getElementById("statusNote");
  el.textContent = msg || "";
  el.className = "status-note" + (warn ? " warn" : "");
}

function fmtDuration(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

async function handleGenerate(){
  const btn = document.getElementById("generateBtn");
  btn.disabled = true;
  setStatus("Scouting the neighbourhood…");
  document.getElementById("walksContainer").innerHTML = "";
  document.getElementById("detailPanel").classList.remove("open");
  selectedWalkIdx = null;

  const startText = document.getElementById("startInput").value || "Rossio, Lisbon";
  const { start, routes } = generateWalkCandidates(startText, state.distance, state.theme);

  if (!routes.length){
    setStatus("Couldn't find enough nearby places for that combination — try a longer distance.", true);
    btn.disabled = false;
    return;
  }

  const distanceLabel = DISTANCES[state.distance].sub;
  const walks = [];
  let anyApproximate = false;

  for (let i=0; i<routes.length; i++){
    setStatus(`Walking the route${routes.length>1 ? `s (${i+1}/${routes.length})` : ""}…`);
    const cand = routes[i];
    let geo;
    try {
      geo = await fetchWalkingRoute(start, cand.stops);
    } catch(e){
      geo = fallbackRoute(start, cand.stops);
      anyApproximate = true;
    }
    let text;
    try {
      text = await aiNarrative(state.theme, cand.stops, distanceLabel);
    } catch(e){
      text = templateNarrative(state.theme, cand.stops);
    }
    walks.push({
      title: text.title,
      narrative: text.narrative,
      stops: cand.stops,
      start,
      geo,
      scores: walkScores(cand.stops),
    });
  }

  currentWalks = walks;
  renderWalkCards(walks);
  selectWalk(0);
  setStatus(anyApproximate
    ? "Live routing was unavailable for at least one walk — distance shown is estimated."
    : "");
  btn.disabled = false;
}

function renderWalkCards(walks){
  const container = document.getElementById("walksContainer");
  container.innerHTML = `<div class="section-eyebrow">Suggested walks</div>`;
  walks.forEach((w, i) => {
    const card = document.createElement("div");
    card.className = "walk-card";
    card.innerHTML = `
      <p class="wc-title">${w.title}</p>
      <p class="wc-narrative">${w.narrative}</p>
      <div class="wc-meta">
        <span>${w.geo.distanceKm.toFixed(1)} km</span>
        <span>·</span>
        <span>${fmtDuration(w.geo.durationMin)}</span>
        <span>·</span>
        <span>${w.stops.length} stops</span>
      </div>
      <div class="wc-scores">
        <div class="wc-score"><div class="num">${w.scores.interesting}</div><div class="lbl">Interesting</div></div>
        <div class="wc-score"><div class="num">${w.scores.local}</div><div class="lbl">Local</div></div>
        <div class="wc-score"><div class="num">${w.scores.quirky}</div><div class="lbl">Quirky</div></div>
      </div>
    `;
    card.onclick = () => selectWalk(i);
    container.appendChild(card);
  });
}

function selectWalk(idx){
  selectedWalkIdx = idx;
  document.querySelectorAll(".walk-card").forEach((c,i) => c.classList.toggle("selected", i===idx));
  const w = currentWalks[idx];
  renderWalkOnMap(w);
  renderDetail(w);
}

function renderDetail(w){
  const el = document.getElementById("detailPanel");
  el.classList.add("open");
  el.innerHTML = `
    <div class="section-eyebrow">Walk detail</div>
    <h2>${w.title}</h2>
    <div class="d-meta">${w.geo.distanceKm.toFixed(1)} km · approximately ${fmtDuration(w.geo.durationMin)}${w.geo.approximate ? " · estimated" : ""}</div>
    <p class="d-narrative">${w.narrative}</p>
    <div class="stop-list" id="stopList"></div>
  `;
  const list = document.getElementById("stopList");
  w.stops.forEach((poi, i) => {
    const item = document.createElement("div");
    item.className = "stop-item";
    item.innerHTML = `
      <div class="stop-num">${String(i+1).padStart(2,"0")}</div>
      <div class="stop-body">
        <div class="stop-name">${poi.name}</div>
        <div class="stop-desc">${poi.desc}</div>
      </div>
    `;
    item.onclick = () => flyToStop(i);
    list.appendChild(item);
  });
  el.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

/* --------------------------------- INIT --------------------------------------- */
function init(){
  buildStaticUI();
  initMap();
  document.querySelectorAll(".distance-opt").forEach(e => {
    if (e.dataset.key === state.distance) e.classList.add("active");
  });
}
init();
</script>
</body>
</html>
