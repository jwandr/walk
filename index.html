<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wander Generator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#FAF9F4;--panel:#FFFFFF;--panel-raised:#FCFBF7;--cream:#171B18;--cream-dim:#767D72;--gold:#1E7A5F;--gold-soft:#279173;--rust:#FF6B4A;--teal:#4F8B82;--line:rgba(23,27,24,.08);--line-strong:rgba(23,27,24,.15)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Inter,sans-serif;overflow:hidden}
.app{display:flex;height:100vh;width:100vw}
.panel{width:430px;min-width:430px;height:100%;background:var(--panel);box-shadow:1px 0 0 var(--line),4px 0 24px rgba(23,27,24,.04);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.panel-scroll{overflow-y:auto;flex:1;padding:28px 26px 40px}
.panel-scroll::-webkit-scrollbar{width:8px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand svg{flex-shrink:0}
.brand h1{font-family:Sora,sans-serif;font-weight:600;font-size:25px;letter-spacing:-.2px;margin:0}
.tagline{font-style:italic;color:var(--cream-dim);font-size:14.5px;margin:0 0 28px}
label.field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:8px;margin-top:22px}
label.field-label:first-of-type{margin-top:0}
.location-row{display:flex;gap:8px}
input[type=text]{width:100%;background:var(--ink);border:1px solid var(--line-strong);color:var(--cream);font-family:Inter,sans-serif;font-size:15px;padding:11px 13px;border-radius:10px;outline:0;transition:border-color .15s ease,box-shadow .15s ease}
input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(30,122,95,.15)}
input[type=text]::placeholder{color:var(--cream-dim);opacity:.7}
.location-button{flex-shrink:0;border:1px solid var(--line-strong);background:var(--panel);color:var(--gold);border-radius:10px;padding:0 13px;cursor:pointer;font-family:Sora,sans-serif;font-size:12px;font-weight:500;transition:.15s ease}
.location-button:hover{border-color:var(--gold);background:rgba(30,122,95,.06)}
.location-button:disabled{opacity:.55;cursor:wait}
.location-help{margin-top:7px;color:var(--cream-dim);font-size:11.5px;line-height:1.4}
.distance-row{display:flex;gap:8px}
.distance-opt{flex:1;padding:10px 6px;text-align:center;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;font-size:12.5px;line-height:1.3;color:var(--cream-dim);transition:all .15s ease;user-select:none}
.distance-opt strong{display:block;font-family:Sora,sans-serif;font-size:16px;color:var(--cream);font-weight:500}
.distance-opt:hover{border-color:var(--gold-soft)}
.distance-opt.active{border-color:var(--gold);background:rgba(30,122,95,.08);color:var(--cream)}
.purpose-input{min-height:74px;resize:vertical;width:100%;background:var(--ink);border:1px solid var(--line-strong);color:var(--cream);font-family:Inter,sans-serif;font-size:14px;line-height:1.45;padding:11px 13px;border-radius:10px;outline:0;transition:border-color .15s ease,box-shadow .15s ease}
.purpose-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(30,122,95,.15)}
.purpose-input::placeholder{color:var(--cream-dim);opacity:.7}
.quick-purposes{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.purpose-chip{border:1px solid var(--line-strong);border-radius:999px;padding:6px 10px;font-size:11.5px;color:var(--cream-dim);cursor:pointer;transition:.15s ease;user-select:none}
.purpose-chip:hover{border-color:var(--gold-soft);color:var(--cream)}
.purpose-chip.active{border-color:var(--gold);background:rgba(30,122,95,.08);color:var(--gold)}
.generate-btn{width:100%;margin-top:24px;padding:14px;background:var(--gold);color:#fff;border:none;border-radius:10px;font-family:Sora,sans-serif;font-weight:600;font-size:16px;cursor:pointer;letter-spacing:.1px;box-shadow:0 4px 14px rgba(30,122,95,.28);transition:background .15s ease,transform .1s ease,box-shadow .15s ease}
.generate-btn:hover{background:var(--gold-soft);box-shadow:0 6px 18px rgba(30,122,95,.32)}
.generate-btn:active{transform:scale(.99)}
.generate-btn:disabled{opacity:.55;cursor:wait}
.status-note{font-size:11.5px;color:var(--cream-dim);margin-top:10px;min-height:16px;font-family:'IBM Plex Mono',monospace;line-height:1.4}
.status-note.warn{color:var(--rust)}
.walks{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.section-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.walk-card{background:var(--panel-raised);border:1px solid var(--line);border-left:3px solid transparent;border-radius:14px;padding:16px 18px;cursor:pointer;box-shadow:0 1px 2px rgba(23,27,24,.04);transition:border-color .15s ease,background .15s ease,box-shadow .15s ease,transform .1s ease}
.walk-card:hover{border-color:var(--line-strong);box-shadow:0 6px 18px rgba(23,27,24,.08);transform:translateY(-1px)}
.walk-card.selected{border-left-color:var(--gold);background:rgba(30,122,95,.06);border-color:var(--line-strong);box-shadow:0 6px 18px rgba(23,27,24,.08)}
.walk-card .wc-title{font-family:Sora,sans-serif;font-size:19px;font-weight:600;margin:0 0 6px}
.walk-card .wc-narrative{font-size:13px;line-height:1.5;color:var(--cream-dim);margin:0 0 12px}
.wc-meta{display:flex;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold-soft);margin-bottom:10px;flex-wrap:wrap}
.wc-scores{display:flex;gap:16px;padding-top:10px;border-top:1px solid var(--line)}
.wc-score{text-align:left}
.wc-score .num{font-family:Sora,sans-serif;font-size:17px;color:var(--cream);font-weight:500}
.wc-score .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--cream-dim)}
.detail{margin-top:26px;padding-top:22px;border-top:1px solid var(--line-strong);display:none}
.detail.open{display:block}
.detail h2{font-family:Sora,sans-serif;font-weight:600;font-size:22px;margin:0 0 6px}
.detail .d-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-soft);margin-bottom:10px}
.detail .d-narrative{font-style:italic;font-size:14.5px;line-height:1.55;color:var(--cream-dim);margin-bottom:20px}
.stop-list{display:flex;flex-direction:column}
.stop-item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stop-item:last-child{border-bottom:none}
.stop-item:hover .stop-num{background:var(--gold);color:var(--ink)}
.stop-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;transition:all .15s ease}
.stop-body .stop-name{font-family:Sora,sans-serif;font-size:15.5px;font-weight:500;margin-bottom:2px}
.stop-body .stop-desc{font-size:12.5px;color:var(--cream-dim);line-height:1.4}
.source-badge{display:inline-block;margin-top:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--cream-dim);opacity:.7}
.map-wrap{flex:1;position:relative;height:100%}
#map{height:100%;width:100%;background:#efede6}
.leaflet-container{font-family:Inter,sans-serif}
.stop-marker{background:var(--panel);border:2px solid var(--gold);color:var(--cream);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;box-shadow:0 2px 8px rgba(23,27,24,.18)}
.start-marker{background:var(--rust);border:2px solid #fff;color:var(--cream);border-radius:50%;width:16px;height:16px;box-shadow:0 0 0 6px rgba(255,107,74,.18),0 2px 6px rgba(23,27,24,.2)}
.leaflet-popup-content-wrapper{background:var(--panel-raised);color:var(--cream);border-radius:12px;box-shadow:0 8px 24px rgba(23,27,24,.14)}
.leaflet-popup-content{font-family:Inter,sans-serif;font-size:13px;margin:10px 12px}
.leaflet-popup-content b{font-family:Sora,sans-serif;font-size:14.5px}
.leaflet-popup-tip{background:var(--panel-raised)}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;pointer-events:none;text-align:center;padding:40px}
.empty-state svg{opacity:.5;margin-bottom:6px}
.empty-state h3{font-family:Sora,sans-serif;font-weight:500;font-size:20px;color:var(--cream-dim);margin:0}
.empty-state p{font-size:13px;color:var(--cream-dim);opacity:.7;max-width:300px;margin:0;line-height:1.5}
.map-badge{position:absolute;left:18px;bottom:18px;z-index:500;background:rgba(255,255,255,.92);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--cream-dim);box-shadow:0 2px 8px rgba(0,0,0,.08)}
@media(max-width:860px){.app{flex-direction:column}.panel{width:100%;min-width:0;height:58%;order:2;border-right:none;border-top:1px solid var(--line)}.map-wrap{height:42%;order:1}}
</style>
</head>
<body>
<div class="app">
<div class="panel">
<div class="panel-scroll" id="panelScroll">
<div class="brand">
<svg fill="none" height="30" viewBox="0 0 40 40" width="30"><circle cx="20" cy="20" r="18.5" stroke="#1E7A5F" stroke-width="1"/><path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#1E7A5F"/><path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#171B18" opacity=".5"/><circle cx="20" cy="20" r="2" fill="#171B18"/></svg>
<h1>Wander Generator</h1>
</div>
<p class="tagline">Find a better way to wander.</p>
<label class="field-label">Starting point</label>
<div class="location-row">
<input id="startInput" type="text" placeholder="A place, address or neighbourhood">
<button class="location-button" id="locationButton" title="Use my current location">From here</button>
</div>
<div class="location-help" id="locationHelp">Enter somewhere, or use your current location.</div>
<label class="field-label">Walking distance</label>
<div class="distance-row" id="distanceRow"></div>
<label class="field-label">What are you in the mood for?</label>
<textarea class="purpose-input" id="purposeInput" placeholder="e.g. Weird history, interesting buildings and somewhere good for coffee."></textarea>
<div class="quick-purposes" id="quickPurposes"></div>
<button class="generate-btn" id="generateBtn">Generate walks</button>
<div class="status-note" id="statusNote"></div>
<div class="walks" id="walksContainer"></div>
<div class="detail" id="detailPanel"></div>
</div>
</div>
<div class="map-wrap">
<div id="map"></div>
<div class="empty-state" id="emptyState">
<svg fill="none" height="46" viewBox="0 0 40 40" width="46"><circle cx="20" cy="20" r="18.5" stroke="#8A9186" stroke-width="1"/><path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#8A9186"/><path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#8A9186" opacity=".4"/></svg>
<h3>Your walk will appear here</h3>
<p>Tell Wander where you are and what you're in the mood for. It'll find somewhere worth walking to.</p>
</div>
<div class="map-badge">OpenStreetMap · live geographic data</div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG={
  nominatim:"https://nominatim.openstreetmap.org",
  overpassEndpoints:[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
  ],
  routing:"https://routing.openstreetmap.de/routed-foot/route/v1/foot",
  maxCandidates:70,
  routesToGenerate:3,
  discoveryRadiusMultiplier:.9,
  requestTimeout:14000
};
const state={
  distance:"medium",
  start:null,
  startText:"",
  purpose:"",
  preferences:null,
  currentWalks:[],
  selectedWalk:null,
  searchId:0
};
let map=null,startMarker=null,routeLayer=null,stopMarkers=[];

const DISTANCES={
  short:{
    label:"Short",
    sub:"3–5 km",
    target:4,
    radius:1100,
    minKm:3,
    maxKm:5,
    stops:[4,5]
  },
  medium:{
    label:"Medium",
    sub:"5–8 km",
    target:6.5,
    radius:1700,
    minKm:5,
    maxKm:8,
    stops:[5,6]
  },
  long:{
    label:"Long",
    sub:"8–11 km",
    target:9.5,
    radius:2400,
    minKm:8,
    maxKm:11,
    stops:[6,7]
  }
};

const QUICK_PURPOSES=[
  "Curious",
  "History",
  "Architecture",
  "Nature",
  "Weird",
  "Food & coffee",
  "Hidden places",
  "Local life",
  "Surprise me"
];

function initMap(){
  map=L.map("map",{zoomControl:true,attributionControl:true}).setView([-31.9523,115.8613],13);
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {
      attribution:"&copy; OpenStreetMap contributors &copy; CARTO",
      subdomains:"abcd",
      maxZoom:19
    }
  ).addTo(map);
  routeLayer=L.layerGroup().addTo(map);
}

function clearMapLayers(){
  routeLayer.clearLayers();
  stopMarkers=[];
  if(startMarker){
    map.removeLayer(startMarker);
    startMarker=null;
  }
}

function renderStartMarker(place){
  if(startMarker)map.removeLayer(startMarker);
  startMarker=L.marker(
    [place.lat,place.lon],
    {
      icon:L.divIcon({
        className:"",
        html:'<div class="start-marker"></div>',
        iconSize:[16,16],
        iconAnchor:[8,8]
      })
    }
  ).bindPopup("<b>Your starting point</b>").addTo(map);
}

function getCurrentLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("Geolocation isn't available in this browser."));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      e=>{
        resolve({
          lat:e.coords.latitude,
          lon:e.coords.longitude,
          displayName:"Your current location",
          source:"browser"
        });
      },
      e=>{
        let message="Couldn't get your location.";
        if(e.code===1)message="Location permission was denied.";
        if(e.code===2)message="Your location couldn't be determined.";
        if(e.code===3)message="Location lookup timed out.";
        reject(new Error(message));
      },
      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:60000
      }
    );
  });
}

async function fetchWithTimeout(url,options={},timeout=CONFIG.requestTimeout){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    return await fetch(url,{...options,signal:controller.signal});
  }catch(error){
    if(error.name==="AbortError")throw new Error("The geographic search timed out. Please try again.");
    throw error;
  }finally{
    clearTimeout(timer);
  }
}

async function geocode(query){
  const url=CONFIG.nominatim+"/search?"+new URLSearchParams({
    q:query,
    format:"json",
    limit:"1",
    addressdetails:"1"
  });
  const response=await fetchWithTimeout(
    url,
    {headers:{Accept:"application/json"}},
    10000
  );
  if(!response.ok)throw new Error("Location search failed.");
  const results=await response.json();
  if(!results.length)throw new Error(`Couldn't find "${query}".`);
  const item=results[0];
  return{
    lat:Number(item.lat),
    lon:Number(item.lon),
    displayName:item.display_name,
    source:"nominatim",
    osmId:item.osm_id,
    osmType:item.osm_type
  };
}

function haversineKm(a,b){
  const lat1=a.lat*Math.PI/180;
  const lat2=b.lat*Math.PI/180;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lon-a.lon)*Math.PI/180;
  const h=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 12742*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function interpretPurpose(text){
  const value=(text||"").toLowerCase().trim();
  const result={
    interest:.5,
    quirky:0,
    history:0,
    food:0,
    nature:0,
    architecture:0,
    local:.5,
    touristPenalty:.5,
    categories:[],
    keywords:[]
  };

  if(!value){
    result.interest=1;
    result.quirky=.5;
    result.history=.4;
    result.nature=.4;
    result.architecture=.4;
    return result;
  }

  if(
    value.includes("curious")||
    value.includes("interesting")||
    value.includes("discover")
  )result.interest+=1;

  if(
    value.includes("weird")||
    value.includes("odd")||
    value.includes("strange")||
    value.includes("quirky")||
    value.includes("unusual")||
    value.includes("eccentric")
  )result.quirky+=1.5;

  if(
    value.includes("history")||
    value.includes("historic")||
    value.includes("heritage")||
    value.includes("old")||
    value.includes("ancient")
  ){
    result.history+=1.4;
    result.categories.push("historic");
  }

  if(
    value.includes("architecture")||
    value.includes("building")||
    value.includes("buildings")||
    value.includes("design")
  ){
    result.architecture+=1.4;
    result.categories.push("architecture");
  }

  if(
    value.includes("nature")||
    value.includes("green")||
    value.includes("park")||
    value.includes("garden")||
    value.includes("trees")||
    value.includes("wildlife")
  ){
    result.nature+=1.5;
    result.categories.push("nature");
  }

  if(
    value.includes("food")||
    value.includes("eat")||
    value.includes("coffee")||
    value.includes("cafe")||
    value.includes("bakery")||
    value.includes("market")||
    value.includes("lunch")
  ){
    result.food+=1.5;
    result.categories.push("food");
  }

  if(
    value.includes("local")||
    value.includes("locals")||
    value.includes("neighbourhood")||
    value.includes("neighborhood")
  ){
    result.local+=1.4;
    result.touristPenalty+=.8;
  }

  if(
    value.includes("hidden")||
    value.includes("secret")||
    value.includes("unknown")||
    value.includes("quiet")||
    value.includes("underrated")
  ){
    result.local+=1;
    result.quirky+=.8;
    result.touristPenalty+=1;
  }

  if(
    value.includes("tourist")&&
    (
      value.includes("avoid")||
      value.includes("less")||
      value.includes("away")||
      value.includes("don't")
    )
  )result.touristPenalty+=1.5;

  result.keywords=value.split(/[\s,.;!?]+/).filter(x=>x.length>3);
  return result;
}

function buildOverpassQueries(start,radius){
  const area=`(around:${Math.round(radius)},${start.lat},${start.lon})`;
  const queries=[
`[out:json][timeout:12];
(
  nwr${area}[tourism~"attraction|museum|gallery|artwork|viewpoint|zoo|theme_park|aquarium|gallery"];
  nwr${area}[historic];
  nwr${area}[memorial];
  nwr${area}[amenity~"arts_centre|cafe|restaurant|theatre|cinema|library|marketplace"];
  nwr${area}[leisure~"park|garden|nature_reserve"];
  nwr${area}[natural~"beach|wood|water|peak"];
  nwr${area}[man_made~"tower|bridge|monument"];
);
out center tags;`
  ];
  return queries;
}

async function queryOverpass(query){
  const endpoints=[...CONFIG.overpassEndpoints];
  const offset=Math.floor(Math.random()*endpoints.length);
  endpoints.push(...endpoints.splice(0,offset));

  let lastError=null;

  for(const endpoint of endpoints){
    for(let attempt=0;attempt<1;attempt++){
      try{
        const response=await fetchWithTimeout(
          endpoint,
          {
            method:"POST",
            headers:{
              "Content-Type":"text/plain;charset=UTF-8",
              Accept:"application/json"
            },
            body:query
          },
          CONFIG.requestTimeout
        );

        if(response.status===429||response.status===502||response.status===503||response.status===504){
          lastError=new Error(`Overpass returned ${response.status}`);
          continue;
        }

        if(!response.ok){
          lastError=new Error(`Overpass returned ${response.status}`);
          break;
        }

        return await response.json();
      }catch(error){
        lastError=error;
      }
    }
  }

  throw lastError||new Error("Place discovery failed.");
}

function capCategoryShare(places,maxTotal,maxShare){
  const byCategory={};
  for(const place of places){
    (byCategory[place.category]=byCategory[place.category]||[]).push(place);
  }
  const categories=Object.keys(byCategory);
  const perCategoryCap=Math.max(2,Math.round(maxTotal*maxShare));

  const result=[];
  const leftovers=[];
  for(const cat of categories){
    const items=byCategory[cat];
    result.push(...items.slice(0,perCategoryCap));
    leftovers.push(...items.slice(perCategoryCap));
  }

  // only top up from the capped-out categories if the balanced pool is too
  // thin to build a good route from - don't backfill just to hit maxTotal,
  // or the cap defeats its own purpose
  const minViablePool=Math.max(15,Math.round(maxTotal*0.25));
  if(result.length<minViablePool){
    result.push(...leftovers.slice(0,minViablePool-result.length));
  }

  return result.sort(()=>Math.random()-.5).slice(0,maxTotal);
}

async function discoverPlaces(start,radius){
  const queries=buildOverpassQueries(start,radius);
  const all=[];

  for(const query of queries){
    try{
      const data=await queryOverpass(query);
      if(data&&Array.isArray(data.elements)){
        all.push(...data.elements);
      }
    }catch(error){
      console.warn("Place discovery query failed:",error);
    }
  }

  if(!all.length)throw new Error("Couldn't find enough mapped places nearby. Please try again in a moment.");

  const places=[];

  for(const element of all){
    const tags=element.tags||{};
    const name=tags.name||tags["name:en"];
    const lat=element.lat??element.center?.lat;
    const lon=element.lon??element.center?.lon;

    if(!name||typeof lat!=="number"||typeof lon!=="number")continue;

    const place=normalisePlace(
      element,
      tags,
      lat,
      lon,
      name
    );

    if(place)places.push(place);
  }

  let result=deduplicatePlaces(places);

  result=result
    .filter(place=>haversineKm(start,place)>0.15)
    .sort(()=>Math.random()-.5);

  result=capCategoryShare(result,CONFIG.maxCandidates,.32);

  return result;
}

function normalisePlace(element,tags,lat,lon,name){
  const type=detectPlaceType(tags);
  return{
    id:`${element.type}-${element.id}`,
    osmId:element.id,
    osmType:element.type,
    name,
    lat,
    lon,
    type,
    category:type.category,
    description:createPlaceDescription(tags,type,`${element.type}-${element.id}`),
    tags,
    touristiness:estimateTouristiness(tags,type),
    interest:calculateInterest(tags,type),
    quirky:calculateQuirk(tags,type),
    history:calculateHistory(tags,type),
    food:calculateFood(tags,type),
    nature:calculateNature(tags,type),
    architecture:calculateArchitecture(tags,type)
  };
}

function detectPlaceType(tags){
  if(tags.historic||tags.archaeological_site)
    return{label:"Historic site",category:"history"};
  if(tags.tourism==="museum")
    return{label:"Museum",category:"culture"};
  if(tags.tourism==="gallery"||tags.amenity==="arts_centre")
    return{label:"Arts",category:"culture"};
  if(tags.tourism==="viewpoint")
    return{label:"Viewpoint",category:"nature"};
  if(tags.leisure==="park")
    return{label:"Park",category:"nature"};
  if(tags.leisure==="garden")
    return{label:"Garden",category:"nature"};
  if(tags.leisure==="nature_reserve")
    return{label:"Nature reserve",category:"nature"};
  if(tags.natural)
    return{label:"Natural feature",category:"nature"};
  if(tags.amenity==="cafe")
    return{label:"Café",category:"food"};
  if(tags.amenity==="restaurant")
    return{label:"Restaurant",category:"food"};
  if(tags.amenity==="marketplace")
    return{label:"Market",category:"food"};
  if(tags.memorial||tags.historic==="memorial")
    return{label:"Memorial",category:"history"};
  if(tags.man_made==="monument")
    return{label:"Monument",category:"quirky"};
  if(tags.man_made==="tower")
    return{label:"Tower",category:"architecture"};
  if(tags.man_made==="bridge")
    return{label:"Bridge",category:"architecture"};
  if(tags.tourism)
    return{label:"Attraction",category:"culture"};
  return{label:"Interesting place",category:"interest"};
}

const FALLBACK_PHRASES={
  food:[
    "A local spot to grab something to eat or drink along the way.",
    "Worth a stop if you fancy a coffee or a bite mid-walk.",
    "A casual place for food or drink partway through the route.",
    "Not extensively documented, but a handy stop for a break."
  ],
  nature:[
    "A pocket of green worth a short detour.",
    "An open space to catch your breath partway through the walk.",
    "A quiet outdoor spot away from the main streets.",
    "Worth pausing here for the surroundings alone."
  ],
  history:[
    "A site with some history behind it, even if the details are thin on the map.",
    "Marked as historically significant, worth a closer look in person.",
    "Part of the older layer of the city, easy to miss if you're not looking.",
    "One of the area's older landmarks, lightly documented but worth a glance."
  ],
  culture:[
    "A cultural spot worth a short visit if the timing works out.",
    "Part of the local arts and culture scene.",

    "A cultural landmark, lightly documented but locally known."
  ],
  architecture:[
    "Worth a look up as you pass - the building itself is the point of interest.",
    "An example of the area's architecture worth a glance.",
    "Structurally interesting enough to justify the detour.",
    "Worth pausing to look at, even briefly."
  ],
  quirky:[
    "One of those small oddities that make a walk worth taking.",
    "Not a major sight, but the kind of thing worth noticing.",
    "A minor curiosity worth a second look.",
    "The sort of detail most people walk straight past."
  ],
  interest:[
    "Marked as worth a look, even without much detail attached.",
    "An interesting stop worth including on the way.",
    "Not extensively documented, but flagged as worth a visit.",
    "Worth a short detour to see for yourself."
  ]
};

function createPlaceDescription(tags,type,seed){
  const descriptions=[];
  if(tags.description)descriptions.push(tags.description);
  if(tags.cuisine)descriptions.push(`${humaniseTag(tags.cuisine)} cuisine`);
  if(tags.historic)descriptions.push(humaniseTag(tags.historic));
  if(tags.tourism&&!descriptions.length)descriptions.push(humaniseTag(tags.tourism));
  if(tags.architect)descriptions.push(`designed by ${tags.architect}`);
  if(tags.start_date)descriptions.push(`dating from ${tags.start_date}`);
  if(tags.brand)descriptions.push(`part of the ${tags.brand} chain`);

  if(descriptions.length)return descriptions.slice(0,2).join(" · ");

  const pool=FALLBACK_PHRASES[type.category]||FALLBACK_PHRASES.interest;
  const random=seededRandom(seed||type.label);
  return pool[Math.floor(random()*pool.length)];
}

function humaniseTag(value){
  return String(value)
    .replace(/_/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());
}

function calculateInterest(tags,type){
  let score=2;
  if(tags.wikipedia)score+=2;
  if(tags.wikidata)score+=1;
  if(tags.description)score+=1;
  if(tags.start_date)score+=1;
  if(tags.architect)score+=1;
  if(type.category==="culture")score+=1;
  return Math.min(5,score);
}

function calculateQuirk(tags,type){
  let score=0;
  if(tags.memorial)score+=2;
  if(tags.historic)score+=1;
  if(tags.artwork_type)score+=2;
  if(tags.man_made)score+=1;
  if(tags.description)score+=1;
  if(tags.historic==="ruins"||tags.historic==="archaeological_site")score+=2;
  return Math.min(5,score);
}

function calculateHistory(tags,type){
  let score=0;
  if(tags.historic)score+=3;
  if(tags.start_date)score+=1;
  if(tags.wikipedia)score+=1;
  if(tags.wikidata)score+=1;
  return Math.min(5,score);
}

function calculateFood(tags,type){
  if(tags.amenity==="cafe")return 4;
  if(tags.amenity==="restaurant")return 4;
  if(tags.amenity==="marketplace")return 5;
  if(tags.shop==="bakery")return 5;
  return 0;
}

function calculateNature(tags,type){
  let score=0;
  if(tags.leisure==="park")score=5;
  if(tags.leisure==="garden")score=5;
  if(tags.leisure==="nature_reserve")score=5;
  if(tags.natural)score=Math.max(score,4);
  if(tags.tourism==="viewpoint")score=Math.max(score,4);
  return score;
}

function calculateArchitecture(tags,type){
  let score=0;
  if(tags.architect)score+=3;
  if(tags.building)score+=1;
  if(tags.historic)score+=2;
  if(tags.tourism==="museum")score+=1;
  return Math.min(5,score);
}

function estimateTouristiness(tags,type){
  let score=1;
  if(tags.wikipedia)score+=1;
  if(tags.wikidata)score+=1;
  if(tags.tourism==="attraction")score+=2;
  if(tags.tourism==="museum")score+=1;
  if(tags.tourism==="viewpoint")score+=1;
  if(tags.historic==="monument")score+=1;
  return Math.min(5,score);
}

function deduplicatePlaces(places){
  const result=[];
  for(const place of places){
    if(!result.some(existing=>haversineKm(existing,place)<.035)){
      result.push(place);
    }
  }
  return result;
}

function scorePlace(place,prefs){
  let score=0;
  score+=place.interest*prefs.interest;
  score+=place.quirky*prefs.quirky;
  score+=place.history*prefs.history;
  score+=place.food*prefs.food;
  score+=place.nature*prefs.nature;
  score+=place.architecture*prefs.architecture;
  score+=place.local*prefs.local;
  score-=place.touristiness*prefs.touristPenalty*.5;

  // cafes/restaurants are numerous almost everywhere - don't let base rate
  // dominate the walk unless the person actually asked for food
  if(place.category==="food"&&prefs.food<=.5)score-=1.5;

  // chain/franchise locations tend to read identically wherever you find
  // them; nudge toward independent places unless food was requested
  if(place.tags&&place.tags.brand&&prefs.food<=.5)score-=1;

  return score;
}

function rankCandidates(places,start,prefs){
  return places
    .map(place=>{
      const distance=haversineKm(start,place);
      return{
        place,
        distance,
        score:scorePlace(place,prefs)-.25*distance
      };
    })
    .sort((a,b)=>b.score-a.score);
}

function hashString(value){
  let hash=2166136261;
  for(let i=0;i<value.length;i++){
    hash^=value.charCodeAt(i);
    hash=Math.imul(hash,16777619);
  }
  return hash>>>0;
}

function seededRandom(seed){
  let value=hashString(seed);
  return function(){
    value+=1831565813;
    let t=value;
    t=Math.imul(t^t>>>15,1|t);
    t^=t+Math.imul(t^t>>>7,61|t);
    return((t^t>>>14)>>>0)/4294967296;
  };
}

function buildCandidateRoute(start,candidates,distanceConfig,seed){
  const random=seededRandom(
    `${state.searchId}|${start.lat}|${start.lon}|${seed}|${Date.now()}`
  );
  const minStops=distanceConfig.stops[0];
  const maxStops=distanceConfig.stops[1];
  const chosen=[];
  const used=new Set();
  let current=start;
  let travelled=0;

  const pool=candidates
    .slice(0,Math.min(candidates.length,50))
    .sort(()=>random()-.5);

  for(let guard=0;guard<100&&chosen.length<maxStops;guard++){
    const available=pool.filter(item=>!used.has(item.place.id));

    if(!available.length)break;

    const categoryCounts={};
    chosen.forEach(s=>{ categoryCounts[s.category]=(categoryCounts[s.category]||0)+1; });

    const scored=available.map(item=>{
      const toPlace=haversineKm(current,item.place);
      const home=haversineKm(item.place,start);
      const projected=travelled+toPlace+home;

      let score=item.score;

      // hard cap: never pick a stop that would blow the loop budget
      if(projected>distanceConfig.maxKm*1.05)return null;

      if(projected>distanceConfig.target)
        score-=(projected-distanceConfig.target)*3;

      // escalating penalty for repeating a category already used in this
      // route (not just the immediately previous stop) - keeps a walk
      // from stacking three cafes just because the pool skewed that way
      const priorCount=categoryCounts[item.place.category]||0;
      if(priorCount>0)score-=priorCount*2.2;

      score+=random()*2;

      return{
        item,
        toPlace,
        score
      };
    }).filter(Boolean).sort((a,b)=>b.score-a.score);

    const shortlist=scored.slice(0,Math.min(8,scored.length));
    if(!shortlist.length)break;

    const selected=shortlist[Math.floor(random()*shortlist.length)];
    chosen.push(selected.item.place);
    used.add(selected.item.place.id);
    travelled+=selected.toPlace;
    current=selected.item.place;

    const homeStretch=haversineKm(current,start);
    if(chosen.length>=minStops&&(travelled+homeStretch)>=distanceConfig.target*0.85)break;
  }

  return chosen;
}

function routeDistance(start,stops){
  if(!stops.length)return 0;
  let total=haversineKm(start,stops[0]);
  for(let i=0;i<stops.length-1;i++){
    total+=haversineKm(stops[i],stops[i+1]);
  }
  total+=haversineKm(stops[stops.length-1],start);
  return total;
}

function improveRoute(start,stops){
  if(stops.length<3)return stops;
  let best=stops.slice();
  let bestDistance=routeDistance(start,best);
  let improved=true;
  let iterations=0;

  while(improved&&iterations<15){
    improved=false;
    iterations++;

    for(let i=0;i<best.length-1;i++){
      for(let j=i+1;j<best.length;j++){
        const candidate=
          best.slice(0,i)
            .concat(best.slice(i,j+1).reverse())
            .concat(best.slice(j+1));

        const distance=routeDistance(start,candidate);

        if(distance<bestDistance-.01){
          best=candidate;
          bestDistance=distance;
          improved=true;
        }
      }
    }
  }

  return best;
}

function routeOverlap(a,b){
  if(!a.length||!b.length)return 0;
  const ids=new Set(a.map(x=>x.id));
  return b.filter(x=>ids.has(x.id)).length/Math.min(a.length,b.length);
}

function generateWalkCandidates(start,places,prefs,distanceKey){
  const config=DISTANCES[distanceKey];
  const ranked=rankCandidates(places,start,prefs);
  const candidates=[];

  for(let i=0;i<30;i++){
    let stops=buildCandidateRoute(
      start,
      ranked,
      config,
      `${state.searchId}-${i}`
    );

    if(stops.length<config.stops[0])continue;

    stops=improveRoute(start,stops);

    const geometricDistance=routeDistance(start,stops);

    if(
      geometricDistance<config.minKm*0.75||
      geometricDistance>config.maxKm*1.15
    )continue;

    candidates.push({
      stops,
      geometricDistance,
      score:stops.reduce(
        (sum,place)=>sum+scorePlace(place,prefs),
        0
      )
    });
  }

  return candidates
    .sort((a,b)=>b.score-a.score)
    .filter((candidate,index,array)=>{
      return !array
        .slice(0,index)
        .some(existing=>routeOverlap(existing.stops,candidate.stops)>.6);
    })
    .slice(0,8);
}

async function fetchWalkingRoute(start,stops){
  const coordinates=[start,...stops,start]
    .map(place=>`${place.lon},${place.lat}`)
    .join(";");

  const url=
    `${CONFIG.routing}/${coordinates}`+
    "?overview=full&geometries=geojson";

  const response=await fetchWithTimeout(
    url,
    {headers:{Accept:"application/json"}},
    20000
  );

  if(!response.ok)throw new Error("Walking route request failed.");

  const data=await response.json();

  if(!data.routes||!data.routes.length)
    throw new Error("No walking route returned.");

  const route=data.routes[0];
  const distanceKm=route.distance/1000;
  const walkingMin=route.duration/60;
  const stopMin=stops.reduce(
    (sum,stop)=>sum+estimateVisitTime(stop),
    0
  );
  const wanderAllowance=.1*(walkingMin+stopMin);

  return{
    coordsLatLng:route.geometry.coordinates.map(
      coordinate=>[coordinate[1],coordinate[0]]
    ),
    distanceKm,
    walkingMin,
    stopMin,
    wanderAllowance,
    durationMin:walkingMin+stopMin+wanderAllowance,
    approximate:false
  };
}

function estimateVisitTime(place){
  if(place.type?.category==="food")return 10;
  if(place.type?.label==="Museum")return 30;
  if(
    place.type?.category==="culture"||
    place.type?.category==="history"
  )return 15;
  return 8;
}

function fallbackRoute(start,stops){
  const points=[start,...stops,start];
  let distance=0;

  for(let i=0;i<points.length-1;i++){
    distance+=haversineKm(points[i],points[i+1]);
  }

  const estimatedDistance=distance*1.35;
  const walkingMin=estimatedDistance/3.8*60;
  const stopMin=stops.reduce(
    (sum,stop)=>sum+estimateVisitTime(stop),
    0
  );

  return{
    coordsLatLng:points.map(point=>[point.lat,point.lon]),
    distanceKm:estimatedDistance,
    walkingMin,
    stopMin,
    durationMin:walkingMin+stopMin,
    approximate:true
  };
}

async function buildRoutableWalks(start,candidates,distanceKey){
  const config=DISTANCES[distanceKey];
  const routed=[];

  // try routing every candidate (already capped at 8 by generateWalkCandidates)
  // rather than stopping at the first N that happen to pass a strict band check
  for(const candidate of candidates){
    try{
      const geo=await fetchWalkingRoute(
        start,
        candidate.stops
      );

      const withinBand=
        geo.distanceKm>=config.minKm&&
        geo.distanceKm<=config.maxKm;

      const bandDiff=withinBand?0:Math.min(
        Math.abs(geo.distanceKm-config.minKm),
        Math.abs(geo.distanceKm-config.maxKm)
      );

      routed.push({
        ...candidate,
        geo,
        withinBand,
        bandDiff
      });
    }catch(error){
      console.warn("Walking router failed:",error);
    }
  }

  if(!routed.length)return [];

  // prefer walks that land inside the requested band; among those outside,
  // prefer the ones closest to it, so a near-miss still surfaces with a warning
  // rather than the whole generation failing outright
  routed.sort((a,b)=>{
    if(a.withinBand!==b.withinBand)return a.withinBand?-1:1;
    return a.bandDiff-b.bandDiff;
  });

  return routed.slice(0,CONFIG.routesToGenerate);
}

const TITLE_ADJECTIVES=[
  "The Unmarked",
  "The Curious",
  "The Slightly Odd",
  "The Overlooked",
  "The Long Way",
  "The Sideways",
  "The Hidden",
  "The Unplanned",
  "The Good Detour"
];

const TITLE_NOUNS=[
  "Wander",
  "Circuit",
  "Detour",
  "Corners",
  "Route",
  "Loop",
  "Afternoon"
];

function generateNarrative(stops,prefs,seed){
  const random=seededRandom(
    stops.map(place=>place.id).join("|")+seed
  );

  const title=
    TITLE_ADJECTIVES[
      Math.floor(random()*TITLE_ADJECTIVES.length)
    ]+
    " "+
    TITLE_NOUNS[
      Math.floor(random()*TITLE_NOUNS.length)
    ];

  const categories=new Set(
    stops.map(place=>place.category)
  );

  const NARRATIVE_VARIANTS={
    food:[
      "This one leaves room for a coffee, a snack or an entirely unnecessary pastry along the way.",
      "There's a built-in excuse to stop and eat somewhere partway through.",
      "Food shapes the route here more than sightseeing does.",
      "Expect at least one good reason to sit down and order something."
    ],
    history:[
      "The route keeps pulling you toward the bits of the city where the present hasn't quite erased the past.",
      "It threads through the older layers of the area, the parts most people walk straight past.",
      "History isn't the backdrop here so much as the point of the walk.",
      "Several stops trade on what used to be here rather than what is."
    ],
    nature:[
      "It looks for pockets of green and places where the city briefly gives way to something quieter.",
      "The route trades pavement for green wherever it reasonably can.",
      "Expect more open sky than storefronts on this one.",
      "It leans toward the quieter, greener parts of the area rather than the busy strip."
    ],
    quirky:[
      "This is the route for the things that make you stop and think, 'Why is that here?'",
      "It favours the odd and overlooked over the obviously photogenic.",
      "Expect a few stops that don't quite explain themselves.",
      "This one collects the small oddities most itineraries skip past."
    ],
    architecture:[
      "Rather than chasing the obvious sights, this one reads the city through the things people built.",
      "It's less about what happened here and more about what still stands.",
      "Buildings do the talking on this route more than plaques or signage.",
      "Worth looking up more than usual on this one."
    ],
    general:[
      "There isn't a grand theme here so much as a trail of things that look worth investigating.",
      "It's a fairly even mix rather than leaning hard into any one thing.",
      "No single theme dominates - just a reasonable spread of things worth a look.",
      "This one doesn't commit to a theme, just a decent handful of stops worth the detour."
    ]
  };

  const dominant=
    prefs.food>1?"food":
    prefs.history>1?"history":
    prefs.nature>1?"nature":
    prefs.quirky>1?"quirky":
    prefs.architecture>1?"architecture":
    "general";

  const variants=NARRATIVE_VARIANTS[dominant];
  const narrative=variants[Math.floor(random()*variants.length)];

  const first=stops[0]?.name||"the starting point";
  const last=stops[stops.length-1]?.name||"somewhere nearby";
  const categoryText=[...categories].slice(0,3).join(", ");

  return{
    title,
    narrative:
      `${narrative} Starting with ${first}, it wanders through ${categoryText} before looping back via ${last}.`
  };
}

function walkScores(stops){
  if(!stops.length){
    return{
      interesting:"0.0",
      local:"0.0",
      quirky:"0.0"
    };
  }

  const average=key=>
    stops.reduce(
      (sum,place)=>sum+(place[key]||0),
      0
    )/stops.length;

  return{
    interesting:Math.min(10,2*average("interest")).toFixed(1),
    local:Math.min(
      10,
      Math.max(
        0,
        2*(5-average("touristiness"))
      )
    ).toFixed(1),
    quirky:Math.min(
      10,
      2*average("quirky")
    ).toFixed(1)
  };
}

function fmtDuration(minutes){
  const hours=Math.floor(minutes/60);
  const mins=Math.round(minutes%60);
  return hours>0
    ?`${hours}h ${mins}m`
    :`${mins}m`;
}

function renderWalkOnMap(walk){
  clearMapLayers();
  document.getElementById("emptyState").style.display="none";
  renderStartMarker(walk.start);

  if(
    walk.geo&&
    walk.geo.coordsLatLng&&
    walk.geo.coordsLatLng.length>1
  ){
    const line=L.polyline(
      walk.geo.coordsLatLng,
      {
        color:walk.geo.approximate?"#FF6B4A":"#1E7A5F",
        weight:4,
        opacity:.85,
        dashArray:walk.geo.approximate?"6,6":null
      }
    ).addTo(routeLayer);

    map.fitBounds(
      line.getBounds(),
      {padding:[60,60]}
    );
  }

  walk.stops.forEach((stop,index)=>{
    const marker=L.marker(
      [stop.lat,stop.lon],
      {
        icon:L.divIcon({
          className:"",
          html:`<div class="stop-marker">${index+1}</div>`,
          iconSize:[28,28],
          iconAnchor:[14,14]
        })
      }
    )
    .bindPopup(
      `<b>${index+1}. ${escapeHtml(stop.name)}</b>`+
      `<br>${escapeHtml(stop.description)}`
    )
    .addTo(routeLayer);

    stopMarkers.push(marker);
  });
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function flyToStop(index){
  const marker=stopMarkers[index];
  if(!marker)return;
  map.flyTo(
    marker.getLatLng(),
    17,
    {duration:.6}
  );
  marker.openPopup();
}

function buildUI(){
  const distanceRow=document.getElementById("distanceRow");

  Object.entries(DISTANCES).forEach(([key,config])=>{
    const option=document.createElement("div");
    option.className=
      "distance-opt"+
      (key===state.distance?" active":"");

    option.innerHTML=
      `<strong>${config.label}</strong>`+
      config.sub;

    option.onclick=()=>{
      state.distance=key;
      document
        .querySelectorAll(".distance-opt")
        .forEach(item=>item.classList.remove("active"));
      option.classList.add("active");
    };

    distanceRow.appendChild(option);
  });

  const purposes=document.getElementById("quickPurposes");

  QUICK_PURPOSES.forEach(purpose=>{
    const chip=document.createElement("div");
    chip.className="purpose-chip";
    chip.textContent=purpose;

    chip.onclick=()=>{
      document
        .querySelectorAll(".purpose-chip")
        .forEach(item=>item.classList.remove("active"));

      chip.classList.add("active");

      document.getElementById("purposeInput").value=
        purpose==="Surprise me"
          ?"Surprise me with something interesting and unexpected."
          :purpose;
    };

    purposes.appendChild(chip);
  });

  document.getElementById("locationButton").onclick=
    useCurrentLocation;

  document.getElementById("generateBtn").onclick=
    handleGenerate;
}

async function useCurrentLocation(){
  const button=document.getElementById("locationButton");
  const help=document.getElementById("locationHelp");

  button.disabled=true;
  help.textContent="Finding you…";

  try{
    const location=await getCurrentLocation();

    state.start=location;
    state.startText=location.displayName;

    document.getElementById("startInput").value=
      "Your current location";

    help.textContent=
      "Location acquired. Generate a wander whenever you're ready.";

    map.setView(
      [location.lat,location.lon],
      15
    );

    renderStartMarker(location);
  }catch(error){
    help.textContent=error.message;
  }finally{
    button.disabled=false;
  }
}

async function resolveStart(){
  const input=
    document.getElementById("startInput")
      .value.trim();

  if(
    state.start&&
    input==="Your current location"
  ){
    return state.start;
  }

  if(input)return geocode(input);

  return getCurrentLocation();
}

function setStatus(message,warn=false){
  const element=
    document.getElementById("statusNote");

  element.textContent=message||"";
  element.className=
    "status-note"+
    (warn?" warn":"");
}

async function handleGenerate(){
  const button=document.getElementById("generateBtn");

  button.disabled=true;

  document.getElementById("walksContainer").innerHTML="";
  document
    .getElementById("detailPanel")
    .classList.remove("open");

  state.currentWalks=[];
  state.selectedWalk=null;
  state.searchId++;

  try{
    setStatus("Finding your starting point…");

    const start=await resolveStart();

    state.start=start;

    map.setView(
      [start.lat,start.lon],
      15
    );

    renderStartMarker(start);

    const purpose=
      document.getElementById("purposeInput")
        .value.trim();

    state.purpose=purpose;
    state.preferences=
      interpretPurpose(purpose);

    const preferences=state.preferences;
    const distanceConfig=DISTANCES[state.distance];

    setStatus(
      "Looking around you for interesting places…"
    );

    const places=await discoverPlaces(
      start,
      distanceConfig.radius*
      CONFIG.discoveryRadiusMultiplier
    );

    if(places.length<distanceConfig.stops[0]){
      throw new Error(
        "There aren't enough mapped places nearby to build a good walk. Try a longer distance."
      );
    }

    setStatus(
      `Found ${places.length} places. Testing possible wanders…`
    );

    const candidates=
      generateWalkCandidates(
        start,
        places,
        preferences,
        state.distance
      );

    if(!candidates.length){
      throw new Error(
        "I found places nearby, but couldn't build a sensible loop. Try increasing the distance."
      );
    }

    setStatus(
      "Checking the actual walking distances…"
    );

    const routed=
      await buildRoutableWalks(
        start,
        candidates,
        state.distance
      );

    if(!routed.length){
      throw new Error(
        `I couldn't find any walkable route near this starting point. Try a different starting point.`
      );
    }

    const walks=[];

    routed.forEach((candidate,index)=>{
      const narrative=
        generateNarrative(
          candidate.stops,
          preferences,
          `${state.searchId}-${index}`
        );

      walks.push({
        title:narrative.title,
        narrative:narrative.narrative,
        stops:candidate.stops,
        start,
        geo:candidate.geo,
        withinBand:candidate.withinBand,
        scores:walkScores(candidate.stops)
      });
    });

    state.currentWalks=walks;

    renderWalkCards(walks);
    selectWalk(0);

    const anyOffTarget=walks.some(w=>!w.withinBand);

    setStatus(
      anyOffTarget
        ?`Discovered ${places.length} places and built ${walks.length} walks — the closest fits ran a little outside ${distanceConfig.sub}.`
        :`Discovered ${places.length} places and built ${walks.length} walks.`
    );
  }catch(error){
    console.error(error);
    setStatus(
      error.message||"Something went wrong.",
      true
    );
  }finally{
    button.disabled=false;
  }
}

function renderWalkCards(walks){
  const container=
    document.getElementById("walksContainer");

  container.innerHTML=
    `<div class="section-eyebrow">Suggested walks</div>`;

  walks.forEach((walk,index)=>{
    const card=document.createElement("div");

    card.className="walk-card";

    card.innerHTML=`
      <p class="wc-title">${escapeHtml(walk.title)}</p>
      <p class="wc-narrative">${escapeHtml(walk.narrative)}</p>
      <div class="wc-meta">
        <span>${walk.geo.distanceKm.toFixed(1)} km</span>
        <span>·</span>
        <span>${fmtDuration(walk.geo.durationMin)}</span>
        <span>·</span>
        <span>${walk.stops.length} stops</span>
        ${walk.geo.approximate?`
          <span>·</span>
          <span>estimated route</span>
        `:""}
        ${!walk.withinBand&&!walk.geo.approximate?`
          <span>·</span>
          <span>closest fit</span>
        `:""}
      </div>
      <div class="wc-scores">
        <div class="wc-score">
          <div class="num">${walk.scores.interesting}</div>
          <div class="lbl">Interesting</div>
        </div>
        <div class="wc-score">
          <div class="num">${walk.scores.local}</div>
          <div class="lbl">Local</div>
        </div>
        <div class="wc-score">
          <div class="num">${walk.scores.quirky}</div>
          <div class="lbl">Quirky</div>
        </div>
      </div>
    `;

    card.onclick=()=>selectWalk(index);

    container.appendChild(card);
  });
}

function selectWalk(index){
  state.selectedWalk=index;

  document
    .querySelectorAll(".walk-card")
    .forEach((card,i)=>{
      card.classList.toggle(
        "selected",
        i===index
      );
    });

  const walk=state.currentWalks[index];

  if(walk){
    renderWalkOnMap(walk);
    renderDetail(walk);
  }
}

function renderDetail(walk){
  const detail=
    document.getElementById("detailPanel");

  detail.classList.add("open");

  detail.innerHTML=`
    <div class="section-eyebrow">Walk detail</div>
    <h2>${escapeHtml(walk.title)}</h2>
    <div class="d-meta">
      ${walk.geo.distanceKm.toFixed(1)} km
      · approximately
      ${fmtDuration(walk.geo.durationMin)}
      ${walk.geo.approximate?" · estimated":""}
    </div>
    <p class="d-narrative">
      ${escapeHtml(walk.narrative)}
    </p>
    <div class="stop-list" id="stopList"></div>
  `;

  const list=
    document.getElementById("stopList");

  walk.stops.forEach((stop,index)=>{
    const item=document.createElement("div");

    item.className="stop-item";

    item.innerHTML=`
      <div class="stop-num">
        ${String(index+1).padStart(2,"0")}
      </div>
      <div class="stop-body">
        <div class="stop-name">
          ${escapeHtml(stop.name)}
        </div>
        <div class="stop-desc">
          ${escapeHtml(stop.description)}
        </div>
        <div class="source-badge">
          OpenStreetMap · ${escapeHtml(stop.type.label)}
        </div>
      </div>
    `;

    item.onclick=()=>flyToStop(index);

    list.appendChild(item);
  });

  detail.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}

function init(){
  buildUI();
  initMap();
}

init();
</script>
</body>
